name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build distribution packages
        run: |
          chmod +x build.sh
          ./build.sh "${{ steps.version.outputs.VERSION }}"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Discover skills. Per-skill zips are named with each skill's own
          # version (read from its SKILL.md frontmatter), not the repo tag.
          SKILL_LIST=""
          for skill_file in */SKILL.md; do
            if [ -f "$skill_file" ]; then
              dir=$(dirname "$skill_file")
              # Extract skill name from YAML frontmatter
              name=$(grep -m1 '^name:' "$skill_file" | sed 's/^name:\s*//')
              # Extract the skill's own version from frontmatter `version:` field
              skill_v=$(awk '/^---$/{i++; next} i==1 && /^version:[[:space:]]*/ {sub(/^version:[[:space:]]*/, ""); print; exit}' "$skill_file")
              SKILL_LIST="${SKILL_LIST}- **${name:-$dir}** \`v${skill_v}\` — \`${dir}-v${skill_v}.zip\`\n"
            fi
          done

          cat <<EOF > release_notes.md
          ## Distribution Packages

          ### Complete Bundle (Recommended)
          - **agent-skills-v${VERSION}.zip** — All skills in one package (snapshot)

          ### Individual Skills
          ${SKILL_LIST}
          Each skill is versioned independently. The bundle version above is the repo-level snapshot tag.

          ### Installation
          Download the complete bundle or individual skill zips from the assets below.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          files: dist/*.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
