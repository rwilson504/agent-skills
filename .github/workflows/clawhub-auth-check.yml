name: ClawHub auth check

# Read-only probe to confirm whether ClawHub authentication is working again.
# Publishes nothing — it only installs the CLI, logs in with CLAWHUB_TOKEN, and
# calls `whoami`. Safe to re-run at any time while ClawHub publishing is paused.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Registry reachability (no auth)
        run: |
          echo "clawhub CLI version:"
          clawhub --cli-version || true
          echo "--- public API ---"
          curl -sS -o /dev/null -w 'GET /api/v1/skills -> %{http_code}\n' \
            https://clawhub.ai/api/v1/skills

      - name: Authenticate
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN"

      - name: Whoami
        run: clawhub whoami

      - name: Dry-run publish (validates bundle + auth, uploads nothing)
        run: clawhub skill publish ./src/skills/power-platform-custom-connector --dry-run
