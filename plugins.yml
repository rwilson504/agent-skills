# plugins.yml
# Composition manifest for the agent-skills marketplace.
#
# This file is the single source of truth for:
#   - Which agents and skills are bundled into each plugin
#   - Plugin-level metadata (description, keywords, license, links)
#   - Marketplace-level metadata
#
# Source files live under src/ (canonical, edited by humans). Plugin folders
# under plugins/ are GENERATED by scripts/build-plugins.ps1. Never edit
# anything under plugins/ by hand — it will be overwritten on every build.
# The lint script (scripts/lint.ps1) flags drift between src/ and plugins/.
#
# Per-skill version lives in src/skills/<name>/SKILL.md frontmatter (required
# by ClawHub / OpenClaw). The plugin-level `version:` here MUST match the
# top-level `version:` in the SKILL.md of each plugin's primary skill. Lint
# enforces this, and scripts/bump-skill-version.mjs updates both atomically.

marketplace:
  name: agent-skills
  description: Specialized skills and agents for building and deploying integrations across Microsoft Power Platform and the n8n workflow automation ecosystem. Includes Power Platform custom connector authoring, the full n8n agent bundle (workflow building, debugging, Code-node scripting, community-node packaging, and self-hosting), and Dataverse Classic Workflow (WF4/XAML) tooling.
  owner_name: rwilson504
  owner_url: https://github.com/rwilson504
  version: 1.0.0
  plugin_root: "."

plugins:

  power-platform-custom-connector:
    description: Build Power Platform custom connectors (Independent Publisher and Verified Publisher) ready for Microsoft certification. Covers Swagger 2.0 / OpenAPI definitions, all 5 authentication types, the 13 policy templates, C# custom code (script.csx), webhook triggers, dynamic values/lists, Copilot Studio AI extensions, and the full certification submission workflow.
    version: 1.0.1
    license: MIT
    category: development
    homepage: https://github.com/rwilson504/agent-skills/tree/main/plugins/power-platform-custom-connector
    repository: https://github.com/rwilson504/agent-skills
    keywords:
      - power-platform
      - custom-connector
      - swagger
      - openapi
      - power-automate
      - power-apps
      - copilot-studio
    skills:
      - power-platform-custom-connector

  n8n-create-nodes:
    description: Build production-ready n8n community nodes as npm packages. Covers declarative (REST API wrapping) and programmatic (custom logic) node styles, credential types, webhook/poll triggers, versioned nodes, and publishing to the n8n community.
    version: 1.0.1
    license: MIT
    category: development
    homepage: https://github.com/rwilson504/agent-skills/tree/main/plugins/n8n-create-nodes
    repository: https://github.com/rwilson504/agent-skills
    keywords:
      - n8n
      - community-nodes
      - node-development
      - npm-package
      - workflow-sdk
    skills:
      - n8n-create-nodes

  n8n-build-workflow:
    description: Design and author n8n workflow JSON — triggers, flow logic (IF/Switch/Merge/Loop), expressions, AI workflows (LangChain cluster nodes), sub-workflows, and the array-of-items data model. Emits import-ready JSON.
    version: 1.0.0
    license: MIT
    category: development
    homepage: https://github.com/rwilson504/agent-skills/tree/main/plugins/n8n-build-workflow
    repository: https://github.com/rwilson504/agent-skills
    keywords:
      - n8n
      - workflow
      - automation
      - ai-workflows
      - low-code
    skills:
      - n8n-build-workflow

  n8n-debug-workflow:
    description: Diagnose failing n8n executions. Indexed error catalog, item-linking forensics, rate-limit recovery, trigger debugging (Webhook/Schedule/App), and resilience patterns (retryOnFail, continueOnFail, Error Workflows).
    version: 1.0.0
    license: MIT
    category: development
    homepage: https://github.com/rwilson504/agent-skills/tree/main/plugins/n8n-debug-workflow
    repository: https://github.com/rwilson504/agent-skills
    keywords:
      - n8n
      - debugging
      - troubleshooting
      - error-handling
      - rate-limits
    skills:
      - n8n-debug-workflow

  n8n-code-node:
    description: Write correct JavaScript or Python in the n8n Code node. Covers both run modes, the canonical pairedItem-preserving pattern, binary helpers, Luxon and JMESPath, the Pyodide runtime, and AI Code Tools.
    version: 1.0.0
    license: MIT
    category: development
    homepage: https://github.com/rwilson504/agent-skills/tree/main/plugins/n8n-code-node
    repository: https://github.com/rwilson504/agent-skills
    keywords:
      - n8n
      - code-node
      - javascript
      - python
      - pyodide
    skills:
      - n8n-code-node

  n8n-self-host:
    description: Install, configure, and operate self-hosted n8n. Day-0 production checklist, Docker Compose (single + queue mode), reverse-proxy configs, Postgres setup and SQLite migration, encryption-key handling, backups, and upgrades.
    version: 1.0.0
    license: MIT
    category: development
    homepage: https://github.com/rwilson504/agent-skills/tree/main/plugins/n8n-self-host
    repository: https://github.com/rwilson504/agent-skills
    keywords:
      - n8n
      - self-hosted
      - docker
      - queue-mode
      - hosting
      - postgres
    skills:
      - n8n-self-host

  n8n:
    description: Full n8n agent bundle — orchestrator agent plus all five n8n skills (build/debug/code-node/self-host/community-nodes). Drives a continuous-learning loop that captures each session's discoveries back into the skill bundle.
    version: 1.0.0
    license: MIT
    category: development
    homepage: https://github.com/rwilson504/agent-skills/tree/main/plugins/n8n
    repository: https://github.com/rwilson504/agent-skills
    keywords:
      - n8n
      - workflow-automation
      - agent
      - orchestrator
      - community-nodes
      - self-hosted
      - ai-workflows
    agents:
      - n8n
    skills:
      - n8n-build-workflow
      - n8n-debug-workflow
